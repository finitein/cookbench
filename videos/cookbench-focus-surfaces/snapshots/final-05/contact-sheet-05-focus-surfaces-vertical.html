<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cookbench 05 Focus Surfaces - Contact Sheet</title>
    <style>
      body { margin: 24px; background: #f4f6f7; color: #151817; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      h1 { margin: 0 0 20px; font-size: 24px; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      figure { margin: 0; border: 1px solid rgba(21, 24, 23, .2); background: #fff; }
      img { display: block; width: 100%; height: auto; }
      figcaption { padding: 10px 12px; color: #b34a1e; font-size: 14px; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Cookbench 05 / Focus Surfaces / 1080x1920 / 23.5s</h1>
    <div class="grid">
      <figure><img src="01-context-switching.png" alt="Context switching pain at 1.6 seconds" /><figcaption>01 / CONTEXT SWITCHING / 1.6s</figcaption></figure>
      <figure><img src="02-minimal-mode.png" alt="Minimal mode at 4.9 seconds" /><figcaption>02 / MINIMAL MODE / 4.9s</figcaption></figure>
      <figure><img src="03-top-dock.png" alt="Top docking at 9 seconds" /><figcaption>03 / TOP DOCK / 9.0s</figcaption></figure>
      <figure><img src="04-status-stoves.png" alt="Status stoves at 13.4 seconds" /><figcaption>04 / STATUS STOVES / 13.4s</figcaption></figure>
      <figure><img src="05-product-boundary.png" alt="Product boundary at 18.2 seconds" /><figcaption>05 / PRODUCT BOUNDARY / 18.2s</figcaption></figure>
      <figure><img src="06-brand-close.png" alt="Brand close at 22.1 seconds" /><figcaption>06 / BRAND CLOSE / 22.1s</figcaption></figure>
    </div>
  </body>
</html>
