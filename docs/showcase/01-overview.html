<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=1200"><title>Cookbench 概览</title><link rel="stylesheet" href="shared.css"></head>
<body>
<main class="poster" data-topic="overview">
  <header class="masthead"><div class="brand"><img src="assets/cookbench-mark.svg" alt="">Cookbench</div><div class="page-no">01 / 12</div></header>
  <section class="body">
    <p class="eyebrow">多个编程 Agent，也能从容掌控</p>
    <h1>所有 Agent 会话，一张清晰工作台。</h1>
    <p class="lead">无需替换你信任的工具，一眼看清谁还在运行、谁在等你、谁已经完成。</p>
    <div class="stage stage--accent">
      <div class="stove-bar">
        <div class="bar-brand"><img src="assets/cookbench-mark.svg" alt=""></div>
        <div class="stoves">
          <div class="stove"><span class="mini-label">CX</span><div class="ring cooking complete"><span>进行中</span></div><div class="stove-name">重构 API</div></div>
          <div class="stove"><span class="mini-label">CL</span><div class="ring needs complete"><span>等你</span></div><div class="stove-name">审查测试</div></div>
          <div class="stove"><span class="mini-label">PI</span><div class="ring cooked complete"><span>已完成</span></div><div class="stove-name">更新文档</div></div>
          <div class="stove"><span class="mini-label">KM</span><div class="ring"><span>62%</span></div><div class="stove-name">修复登录</div></div>
          <div class="stove"><span class="mini-label">ZC</span><div class="ring failed complete"><span>失败</span></div><div class="stove-name">构建发布版</div></div>
        </div>
      </div>
      <div class="metric-grid" style="margin-top:28px">
        <div class="metric"><strong>27</strong><p>个 Harness 适配档案，能力边界清楚标注。</p></div>
        <div class="metric"><strong>3</strong><p>大桌面平台，共用一个本地优先伴侣。</p></div>
        <div class="metric"><strong>0</strong><p>提示词外传、Agent 受控或端口开放。</p></div>
      </div>
    </div>
  </section>
  <footer class="footer"><span><strong>轻量，刻意为之。</strong> 原 Harness 始终掌控工作。</span><span>cookbench</span></footer>
</main>
</body>
</html>
