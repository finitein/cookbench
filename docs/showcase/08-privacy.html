<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=1200"><title>本地优先的隐私边界</title><link rel="stylesheet" href="shared.css"></head>
<body>
<main class="poster theme-green" data-topic="privacy">
  <header class="masthead"><div class="brand"><img src="assets/cookbench-mark.svg" alt="">Cookbench</div><div class="page-no">08 / 13</div></header>
  <section class="body center">
    <p class="eyebrow">是桌面伴侣，不是对话仓库</p>
    <h1>你的会话，始终留在原来的工具里。</h1>
    <p class="lead">原生文件是事实来源。Cookbench 只保存展示和跳回 Stove 所需的最少元数据。</p>
    <div class="stage stage--accent" style="text-align:left">
      <div class="privacy-grid">
        <section class="privacy-item"><h3>Cookbench 只保存</h3><ul class="check-list"><li>有限的展示元数据</li><li>固定与归档状态</li><li>最少的已验证定位信息</li><li>通知偏好设置</li></ul></section>
        <section class="privacy-item"><h3>Cookbench 不保存</h3><ul class="check-list no-list"><li>完整对话内容</li><li>提示词或工具内容</li><li>SQLite 对话数据库</li><li>遥测或入站消息</li></ul></section>
      </div>
      <div class="quote" style="margin-top:38px">观察工作，不接管工作。代码全开源，边界可审查。</div>
    </div>
  </section>
  <footer class="footer"><span><strong>本地优先是架构。</strong> 不是一个隐私开关。</span><span>cookbench</span></footer>
</main>
</body>
</html>
