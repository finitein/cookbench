<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=1200"><title>诚实的支持分级</title><link rel="stylesheet" href="shared.css"></head>
<body>
<main class="poster theme-yellow" data-topic="tiers">
  <header class="masthead"><div class="brand"><img src="assets/cookbench-mark.svg" alt="">Cookbench</div><div class="page-no">04 / 12</div></header>
  <section class="body">
    <p class="eyebrow">可解释的兼容能力</p>
    <h1>“支持”并不是同一回事。</h1>
    <p class="lead">Cookbench 清楚说明每个 Harness 实际能提供多少身份、生命周期和跳转证据。</p>
    <div class="tier-grid">
      <section class="tier"><h3>完整适配</h3><strong>14</strong><p>具备结构化身份与生命周期。只有定位信息经过验证，才提供精准跳转。</p></section>
      <section class="tier"><h3>标准适配</h3><strong>12</strong><p>可靠观察，并谨慎跳回应用、项目、IDE 或终端。</p></section>
      <section class="tier"><h3>实验性</h3><strong>1</strong><p>仅检测是否存在，绝不推断任务已经完成。</p></section>
    </div>
    <div class="stage stage--accent" style="min-height:260px">
      <div class="flow"><div class="flow-node">原生会话<br>或 Hook 事件</div><div class="flow-arrow">→</div><div class="flow-node emphasis">核验证据</div><div class="flow-arrow">→</div><div class="flow-node">只呈现可信<br>状态与跳转</div></div>
    </div>
  </section>
  <footer class="footer"><span><strong>沉默绝不等于完成。</strong> 所有判断都有证据。</span><span>cookbench</span></footer>
</main>
</body>
</html>
