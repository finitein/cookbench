<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=1200"><title>一眼看清</title><link rel="stylesheet" href="shared.css"></head>
<body>
<main class="poster theme-blue" data-topic="concurrency">
  <header class="masthead"><div class="brand"><img src="assets/cookbench-mark.svg" alt="">Cookbench</div><div class="page-no">02 / 12</div></header>
  <section class="body">
    <p class="eyebrow">为同时运行多个 Agent 的你而生</p>
    <h1>别再逐个检查终端。</h1>
    <p class="lead">Cookbench 把零散会话汇成实时状态界面，所有进展一眼就懂。</p>
    <div class="stage stage--accent">
      <div class="metric-grid">
        <div class="metric"><div class="ring" style="margin:0 0 20px"><span>48%</span></div><h3>仍在工作</h3><p>只有结构化进度才显示不完整进度弧。</p></div>
        <div class="metric"><div class="ring needs complete" style="margin:0 0 20px"><span>等你</span></div><h3>轮到你了</h3><p>注意状态采用完整圆环，绝不从沉默猜测。</p></div>
        <div class="metric"><div class="ring cooked complete" style="margin:0 0 20px"><span>已完成</span></div><h3>已经就绪</h3><p>完成后持续可见，直到你亲自确认。</p></div>
      </div>
      <div class="quote" style="margin-top:48px">Bar 很小，掌控全局却更轻松。超轻量，是一种克制。</div>
      <div class="tag-row" style="margin-top:36px"><span class="tag">启动中</span><span class="tag">规划中</span><span class="tag">进行中</span><span class="tag">等你处理</span><span class="tag">已完成</span><span class="tag">失败</span><span class="tag">已断开</span></div>
    </div>
  </section>
  <footer class="footer"><span><strong>告别反复巡检。</strong> 把注意力留给真正的工作。</span><span>cookbench</span></footer>
</main>
</body>
</html>
