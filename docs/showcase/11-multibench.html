<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=1200"><title>多排工作台布局</title><link rel="stylesheet" href="shared.css"></head>
<body>
<main class="poster theme-violet" data-topic="multibench">
  <header class="masthead"><div class="brand"><img src="assets/cookbench-mark.svg" alt="">Cookbench</div><div class="page-no">11 / 12</div></header>
  <section class="body">
    <p class="eyebrow">为重度多 Agent 工作而生</p>
    <h1>一排放不下，工作台就自动生长。</h1>
    <p class="lead">少量混合会话保持同排；某个 Harness 太忙则独占一排并自动换行。所有 Stove 一次看全，不出现滚动条。</p>
    <div class="stage stage--accent">
      <div class="bench-stack">
        <div class="bench-row"><div class="bench-label">Codex</div><div class="bench-dots"><div class="bench-dot">42%</div><div class="bench-dot complete neutral">规划</div><div class="bench-dot complete cooked">完成</div><div class="bench-dot complete needs">等你</div><div class="bench-dot">78%</div><div class="bench-dot complete neutral">启动</div></div></div>
        <div class="bench-row"><div class="bench-label">Claude Code</div><div class="bench-dots"><div class="bench-dot complete">运行</div><div class="bench-dot complete cooked">完成</div><div class="bench-dot">31%</div><div class="bench-dot complete needs">等你</div></div></div>
        <div class="bench-row"><div class="bench-label">Pi</div><div class="bench-dots"><div class="bench-dot complete cooked">完成</div><div class="bench-dot">54%</div><div class="bench-dot complete failed">失败</div></div></div>
        <div class="bench-row"><div class="bench-label">Kimi Code</div><div class="bench-dots"><div class="bench-dot">88%</div><div class="bench-dot complete">运行</div><div class="bench-dot complete needs">等你</div><div class="bench-dot complete cooked">完成</div></div></div>
      </div>
      <div class="metric-grid" style="margin-top:34px">
        <div class="metric"><strong>全部</strong><p>默认展示每一个 Stove。</p></div>
        <div class="metric"><strong>0</strong><p>横向滚动条。</p></div>
        <div class="metric"><strong>0</strong><p>纵向滚动条。</p></div>
      </div>
    </div>
  </section>
  <footer class="footer"><span><strong>随手移动，自由缩放。</strong> 布局会自动适应。</span><span>cookbench</span></footer>
</main>
</body>
</html>
