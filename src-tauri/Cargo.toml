[package]
name = "cookbench-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cookbench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.8.1", features = ["tray-icon"] }
tauri-plugin-notification = "2"
cookbench-core = { path = "../crates/cookbench-core" }
cookbench-adapters = { path = "../crates/cookbench-adapters" }
cookbench-bridge = { path = "../crates/cookbench-bridge" }
keyring = "4.1.6"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.0.1"
tauri-plugin-global-shortcut = "2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry"] }

[dev-dependencies]
tauri = { version = "2.8.1", features = ["test"] }
