[package]
name = "cookbench-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cookbench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.8.1", features = [] }
cookbench-core = { path = "../crates/cookbench-core" }
keyring = "4.1.6"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
